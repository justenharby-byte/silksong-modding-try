name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build HookTest.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: HookTest
          path: bin/Release/netstandard2.1/HookTest.dll
          if-no-files-found: error
